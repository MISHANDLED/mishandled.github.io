name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Xcode 27, with Swift 6.4, is the default Xcode on this image.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Swift version
        run: swift --version

      - uses: actions/cache@v6
        with:
          path: .build
          key: build-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: build-${{ runner.os }}-

      - name: Build site
        run: swift run -c release Portfolio

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
